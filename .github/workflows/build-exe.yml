name: Build Windows EXE (Tauri)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'exe file/**'
      - '.github/workflows/build-exe.yml'
    tags:
      - 'v*'

jobs:
  build-tauri:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './exe file/src-tauri -> target'

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0" --locked

      - name: Ensure Desktop Icons
        working-directory: './exe file/src-tauri'
        run: cargo tauri icon ./icons/icon.png

      - name: Build Tauri Desktop EXE
        working-directory: './exe file/src-tauri'
        run: cargo tauri build

      - name: Upload Artifacts (EXE and Installers)
        uses: actions/upload-artifact@v4
        with:
          name: MovieList-Windows-Desktop
          path: |
            ./exe file/src-tauri/target/release/*.exe
            ./exe file/src-tauri/target/release/bundle/nsis/*.exe
            ./exe file/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: warn

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./exe file/src-tauri/target/release/bundle/nsis/*.exe
            ./exe file/src-tauri/target/release/bundle/msi/*.msi
            ./exe file/src-tauri/target/release/*.exe
          generate_release_notes: true
