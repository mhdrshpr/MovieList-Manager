name: Build Android APK (Bubblewrap TWA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'apk file/**'
      - '.github/workflows/build-apk.yml'
    tags:
      - 'v*'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Android SDK & Bubblewrap CLI
        run: |
          # Determine the actual Android SDK directory on the runner
          if [ -n "$ANDROID_HOME" ] && [ -d "$ANDROID_HOME" ]; then
            ACTUAL_SDK="$ANDROID_HOME"
          elif [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT" ]; then
            ACTUAL_SDK="$ANDROID_SDK_ROOT"
          elif [ -d "/usr/local/lib/android/sdk" ]; then
            ACTUAL_SDK="/usr/local/lib/android/sdk"
          elif [ -d "$HOME/Android/Sdk" ]; then
            ACTUAL_SDK="$HOME/Android/Sdk"
          else
            echo "[ERROR] Android SDK directory not found on runner."
            exit 1
          fi

          echo "[INFO] Using Android SDK directory: ${ACTUAL_SDK}"
          echo "ANDROID_HOME=${ACTUAL_SDK}" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=${ACTUAL_SDK}" >> $GITHUB_ENV
          echo "${ACTUAL_SDK}/platform-tools" >> $GITHUB_PATH
          echo "${ACTUAL_SDK}/cmdline-tools/latest/bin" >> $GITHUB_PATH

          # Locate sdkmanager
          SDKMANAGER=""
          if [ -x "${ACTUAL_SDK}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="${ACTUAL_SDK}/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "${ACTUAL_SDK}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)
          fi

          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

          # Accept licenses and ensure required SDK components are installed (platform-tools, build-tools, platform)
          if [ -n "$SDKMANAGER" ]; then
            echo "[INFO] Accepting Android SDK licenses..."
            yes | "$SDKMANAGER" --sdk_root="${ACTUAL_SDK}" --licenses || true

            echo "[INFO] Ensuring required Android SDK components (platform-tools, build-tools, platforms)..."
            yes | "$SDKMANAGER" --sdk_root="${ACTUAL_SDK}" \
              "platform-tools" \
              "build-tools;34.0.0" \
              "platforms;android-34" || true
          fi

          # Ensure directory layout compatibility for Bubblewrap's path checks
          if [ -d "${ACTUAL_SDK}/cmdline-tools/latest" ] && [ ! -d "${ACTUAL_SDK}/cmdline-tools/tools" ]; then
            ln -s "${ACTUAL_SDK}/cmdline-tools/latest" "${ACTUAL_SDK}/cmdline-tools/tools" 2>/dev/null || true
          fi
          if [ -d "${ACTUAL_SDK}/cmdline-tools/latest/bin" ] && [ ! -d "${ACTUAL_SDK}/bin" ]; then
            ln -s "${ACTUAL_SDK}/cmdline-tools/latest/bin" "${ACTUAL_SDK}/bin" 2>/dev/null || true
          fi
          if [ -d "${ACTUAL_SDK}/cmdline-tools/latest" ] && [ ! -d "${ACTUAL_SDK}/tools" ]; then
            ln -s "${ACTUAL_SDK}/cmdline-tools/latest" "${ACTUAL_SDK}/tools" 2>/dev/null || true
          fi

          # Install Bubblewrap CLI
          npm install -g @bubblewrap/cli

          # Configure Bubblewrap paths (both config.json and CLI updateConfig)
          mkdir -p ~/.bubblewrap
          cat <<EOF > ~/.bubblewrap/config.json
          {
            "jdkPath": "${JAVA_HOME}",
            "androidSdkPath": "${ACTUAL_SDK}"
          }
          EOF

          bubblewrap updateConfig --androidSdkPath="${ACTUAL_SDK}" --jdkPath="${JAVA_HOME}" || true
          bubblewrap doctor || true

      - name: Setup Keystore (Custom or Auto-generated)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd "apk file"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "[INFO] Using user-provided keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android.keystore
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV
          else
            echo "[INFO] No keystore secret found. Generating self-signed keystore for build..."
            keytool -genkeypair -v \
              -keystore android.keystore \
              -alias movielist \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "android123" \
              -keypass "android123" \
              -dname "CN=MovieList, OU=MovieManager, O=MovieManager, L=Tehran, ST=Tehran, C=IR"
            echo "KEYSTORE_PASSWORD=android123" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android123" >> $GITHUB_ENV
          fi

      - name: Build Android App (APK & AAB)
        working-directory: './apk file'
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ env.KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ env.KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade || true
          printf "%s\n%s\n" "${{ env.KEYSTORE_PASSWORD }}" "${{ env.KEY_PASSWORD }}" | bubblewrap build --skipVersionUpgrade

      - name: Upload Artifacts (APK and AAB)
        uses: actions/upload-artifact@v4
        with:
          name: MovieList-Android-Release-APK
          path: |
            ./apk file/*.apk
            ./apk file/*.aab
            ./apk file/app-release-signed.apk
            ./apk file/app-release-bundle.aab
          if-no-files-found: warn

      - name: Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./apk file/*.apk
            ./apk file/*.aab
          generate_release_notes: true
