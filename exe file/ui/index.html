<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie List</title>
  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f9fafb;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Vazirmatn", Tahoma, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      text-align: center;
      user-select: none;
    }
    .container {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 25px rgba(99, 102, 241, 0.35);
    }
    .logo svg {
      width: 40px;
      height: 40px;
      fill: none;
      stroke: #fff;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
      margin-bottom: 1.5rem;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(99, 102, 241, 0.2);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 1rem auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.75rem 1.4rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
      width: 100%;
    }
    .btn:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .status {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg viewBox="0 0 24 24">
        <rect x="2" y="2" width="20" height="20" rx="2.18" ry="2.18"></rect>
        <line x1="7" y1="2" x2="7" y2="22"></line>
        <line x1="17" y1="2" x2="17" y2="22"></line>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <line x1="2" y1="7" x2="7" y2="7"></line>
        <line x1="2" y1="17" x2="7" y2="17"></line>
        <line x1="17" y1="17" x2="22" y2="17"></line>
        <line x1="17" y1="7" x2="22" y2="7"></line>
      </svg>
    </div>
    <h1>Movie List</h1>
    <p id="msgText">در حال برقراری ارتباط با سامانه مووی لیست...</p>
    <div class="spinner" id="loaderSpinner"></div>
    <button class="btn" id="retryBtn" style="display: none;" onclick="tryConnect()">تلاش مجدد</button>
    <div class="status" id="statusText">نسخه دسکتاپ ویندوز • ساخت با Tauri</div>
  </div>

  <script>
    const TARGET_URL = 'https://movielist.mhdr-shpr.ir';

    function tryConnect() {
      document.getElementById('msgText').textContent = 'در حال اتصال به سرور...';
      document.getElementById('loaderSpinner').style.display = 'block';
      document.getElementById('retryBtn').style.display = 'none';

      fetch(TARGET_URL, { mode: 'no-cors' })
        .then(() => {
          window.location.href = TARGET_URL;
        })
        .catch(() => {
          document.getElementById('msgText').textContent = 'عدم دسترسی به اینترنت یا سرور در نخستین راه‌اندازی.';
          document.getElementById('loaderSpinner').style.display = 'none';
          document.getElementById('retryBtn').style.display = 'block';
        });
    }

    setTimeout(tryConnect, 400);
  </script>
</body>
</html>
